name: Deployment validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: python3 -m unittest discover -s tests/cli -v
      - run: python3 tools/validate-manifests.py
      - name: Render every environment overlay
        run: for overlay in deploy/overlays/*; do kubectl kustomize "$overlay" >/dev/null; done
